{% extends "base.html" %}

{% block content %}
<div class="card compact-card">
    <span class="pill">New account</span>
    <h1>Create account</h1>
    <p>Register a user using the required <code>POST /register</code> API endpoint.</p>

    <form id="registerForm">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" required>

        <button class="primary" id="registerButton" type="submit">Create account</button>
    </form>

    <div id="message" class="message"></div>

    <p class="link-text">Already registered? <a href="/login">Log in</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Creating...";
        showMessage("Creating your account...", "info");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (response.status === 201) {
                showMessage("Account created. Go to login now.", "success");
                setTimeout(() => window.location.href = "/login", 700);
            } else {
                showMessage(data.error?.message || "Registration failed", "error");
            }
        } catch (error) {
            showMessage("Could not connect to the server.", "error");
        } finally {
            button.disabled = false;
            button.textContent = "Create account";
        }
    });
</script>
{% endblock %}
