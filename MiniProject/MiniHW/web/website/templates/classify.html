{% extends "base.html" %}

{% block content %}
<div class="card">
    <span class="pill">PNG / JPEG only</span>
    <h1>Classify an image</h1>
    <p>
        Upload a valid <strong>.png</strong> or <strong>.jpeg</strong> image. The website calls
        the protected <code>POST /classifier</code> endpoint with your bearer token.
    </p>

    <form id="classifyForm">
        <label for="imageInput">Choose image</label>
        <input id="imageInput" name="image" type="file" accept=".png,.jpeg,image/png,image/jpeg" required>
        <img id="previewImage" class="preview" alt="Selected image preview">
        <button class="primary" id="classifyButton" type="submit">Classify image</button>
    </form>

    <div id="message" class="message"></div>

    <div id="resultBox" class="result-box">
        <table>
            <thead>
                <tr><th>Match</th><th>Score</th></tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    requireTokenForPage();

    const form = document.getElementById("classifyForm");
    const imageInput = document.getElementById("imageInput");
    const previewImage = document.getElementById("previewImage");
    const classifyButton = document.getElementById("classifyButton");
    const message = document.getElementById("message");
    const resultBox = document.getElementById("resultBox");
    const resultBody = document.getElementById("resultBody");
    let isClassifying = false;

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    function resetButton() {
        isClassifying = false;
        classifyButton.disabled = false;
        classifyButton.textContent = "Classify image";
    }

    imageInput.addEventListener("change", function () {
        resultBox.style.display = "none";
        resultBody.innerHTML = "";
        message.className = "message";

        const file = imageInput.files[0];
        if (!file) {
            previewImage.style.display = "none";
            return;
        }
        previewImage.src = URL.createObjectURL(file);
        previewImage.style.display = "block";
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (isClassifying) return;

        const file = imageInput.files[0];
        if (!file) {
            showMessage("Please choose an image first.", "error");
            return;
        }

        isClassifying = true;
        classifyButton.disabled = true;
        classifyButton.textContent = "Classifying...";
        showMessage("Uploading image and waiting for synchronous response...", "info");
        resultBox.style.display = "none";
        resultBody.innerHTML = "";

        const formData = new FormData();
        formData.append("image", file, file.name);

        try {
            const response = await apiFetch("/classifier", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (response.ok && Array.isArray(data.matches)) {
                data.matches.forEach(match => {
                    const row = document.createElement("tr");
                    row.innerHTML = `<td>${match.name}</td><td>${Number(match.score).toFixed(4)}</td>`;
                    resultBody.appendChild(row);
                });
                resultBox.style.display = "block";
                showMessage("Classification completed successfully.", "success");
            } else {
                showMessage(data.error?.message || "Classification failed.", "error");
            }
        } catch (error) {
            showMessage("Could not connect to the server.", "error");
        } finally {
            resetButton();
        }
    });
</script>
{% endblock %}
