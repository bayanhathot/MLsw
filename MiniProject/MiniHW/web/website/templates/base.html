<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "PictureServer" }}</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #697386;
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #15803d;
            --success-bg: #dcfce7;
            --error: #b91c1c;
            --error-bg: #fee2e2;
            --info-bg: #dbeafe;
            --border: #e5e7eb;
            --shadow: 0 18px 50px rgba(15, 23, 42, 0.09);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.12), transparent 30%),
                var(--bg);
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 7vw;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(229, 231, 235, 0.8);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            text-decoration: none;
        }

        .brand-badge {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #14b8a6);
            display: grid;
            place-items: center;
            color: white;
            font-weight: 900;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav a, .nav button {
            border: 0;
            background: transparent;
            padding: 9px 13px;
            border-radius: 999px;
            color: var(--muted);
            text-decoration: none;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        .nav a:hover, .nav button:hover, .nav .active {
            background: #eef4ff;
            color: var(--primary-dark);
        }

        .auth-only { display: none; }
        .logged-in .auth-only { display: inline-flex; }
        .logged-in .guest-only { display: none; }

        main {
            width: min(1120px, 92vw);
            margin: 0 auto;
            padding: 48px 0 70px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            align-items: center;
            gap: 28px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(229, 231, 235, 0.95);
            border-radius: 28px;
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .compact-card { max-width: 480px; margin: 0 auto; }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 3.5rem);
            letter-spacing: -0.06em;
            line-height: 1;
        }

        h2 { margin: 0 0 10px; }
        p { color: var(--muted); line-height: 1.7; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding: 8px 12px;
            border-radius: 999px;
            background: #eef4ff;
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.92rem;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 750;
        }

        input[type="text"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: white;
            color: var(--text);
            font-size: 1rem;
        }

        input:focus {
            outline: 3px solid rgba(37, 99, 235, 0.15);
            border-color: var(--primary);
        }

        .button, button.primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 20px;
            padding: 13px 16px;
            border-radius: 14px;
            border: 0;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }

        .button:hover, button.primary:hover { background: var(--primary-dark); }
        button:disabled { opacity: 0.65; cursor: not-allowed; }

        .secondary {
            background: #eff6ff !important;
            color: var(--primary-dark) !important;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 24px;
        }

        .metric {
            padding: 18px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fbfdff;
        }

        .metric strong {
            display: block;
            font-size: 1.8rem;
            letter-spacing: -0.04em;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 13px 14px;
            border-radius: 14px;
            font-weight: 700;
        }
        .message.success { display: block; background: var(--success-bg); color: var(--success); }
        .message.error { display: block; background: var(--error-bg); color: var(--error); }
        .message.info { display: block; background: var(--info-bg); color: var(--primary-dark); }

        .preview {
            display: none;
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            margin-top: 18px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #f8fafc;
        }

        .result-box {
            display: none;
            margin-top: 22px;
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            background: white;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #f8fafc; color: var(--muted); font-size: 0.9rem; }
        tr:last-child td { border-bottom: 0; }

        .link-text { text-align: center; margin-top: 18px; }
        .link-text a { color: var(--primary); font-weight: 800; text-decoration: none; }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 20px;
        }

        .small { font-size: 0.92rem; color: var(--muted); }

        @media (max-width: 780px) {
            .topbar { padding: 14px 4vw; flex-wrap: wrap; gap: 12px; }
            .nav { width: 100%; justify-content: center; flex-wrap: wrap; }
            .hero, .grid, .actions { grid-template-columns: 1fr; }
            .card { padding: 24px; border-radius: 22px; }
        }
    </style>
</head>
<body class="{{ 'logged-in' if is_logged_in else '' }}">
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-badge">AI</span>
            <span>PictureServer</span>
        </a>

        <nav class="nav" id="mainNav">
            <a class="auth-only {{ 'active' if page == 'dashboard' else '' }}" href="/dashboard">Dashboard</a>
            <a class="auth-only {{ 'active' if page == 'classify' else '' }}" href="/classify">Classify</a>
            <a class="auth-only {{ 'active' if page == 'status' else '' }}" href="/status-page">Status</a>
            <button class="auth-only" id="logoutButton" type="button">Logout</button>
            <a class="guest-only {{ 'active' if page == 'login' else '' }}" href="/login">Login</a>
            <a class="guest-only {{ 'active' if page == 'register' else '' }}" href="/register">Register</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        function getToken() {
            return localStorage.getItem("picture_server_token");
        }

        function setToken(token) {
            localStorage.setItem("picture_server_token", token);
            document.body.classList.add("logged-in");
        }

        function clearToken() {
            localStorage.removeItem("picture_server_token");
            document.body.classList.remove("logged-in");
        }

        function requireTokenForPage() {
            if (!getToken()) {
                window.location.href = "/login";
            }
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            const headers = options.headers || {};
            if (token) {
                headers["Authorization"] = "Bearer " + token;
            }
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) {
                clearToken();
                window.location.href = "/login";
            }
            return response;
        }

        const logoutButton = document.getElementById("logoutButton");
        if (logoutButton) {
            logoutButton.addEventListener("click", async function () {
                const token = getToken();
                if (token) {
                    try {
                        await fetch("/logout", {
                            method: "POST",
                            headers: { "Authorization": "Bearer " + token }
                        });
                    } catch (error) {}
                }
                clearToken();
                window.location.href = "/login";
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
