name: Zonix CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zonix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zonix_test
          POSTGRES_USER: zonix_ci
          POSTGRES_PASSWORD: zonix_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zonix_ci -d zonix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://zonix_ci:zonix_ci_password@localhost:5432/zonix_test
      DATABASE_URL_LOCAL: postgresql+psycopg2://zonix_ci:zonix_ci_password@localhost:5432/zonix_test
      SECRET_KEY: ci-only-secret-that-is-never-used-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Project/backend/requirements.txt
            Project/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Validate PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run backend test suite
        run: >-
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Project/backend/coverage.xml

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Project/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Svelte checks
        run: npm run check

      - name: Build production frontend
        run: npm run build

  # Builds + pushes to GHCR, and deploys - only for real pushes to main.
  # A pull_request run stops after backend-tests/frontend-checks above and
  # never reaches this job, so it can never build, push, or deploy.
  build-and-push:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          short_sha=$(git rev-parse --short HEAD)
          echo "backend_image=ghcr.io/${owner}/zonix-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/zonix-frontend" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: Project/backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:latest
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.short_sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: Project/frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:latest
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.short_sha }}

  deploy-production:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "${SSH_HOST}" || { echo "Repository variable SSH_HOST is not set." >&2; exit 1; }
          test -n "${SSH_USER}" || { echo "Repository variable SSH_USER is not set." >&2; exit 1; }
          test -n "${SSH_PRIVATE_KEY}" || { echo "Repository secret SSH_PRIVATE_KEY is not set." >&2; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/zonix_deploy"
          chmod 600 "${HOME}/.ssh/zonix_deploy"
          ssh-keyscan -H "${SSH_HOST}" > "${HOME}/.ssh/known_hosts" 2>/dev/null
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload compose files
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          ssh -i "${HOME}/.ssh/zonix_deploy" -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/zonix-deploy/deploy"
          scp -i "${HOME}/.ssh/zonix_deploy" -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            Project/docker-compose.prod.yml \
            "${SSH_USER}@${SSH_HOST}:~/zonix-deploy/docker-compose.prod.yml"
          scp -i "${HOME}/.ssh/zonix_deploy" -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            Project/deploy/Caddyfile \
            Project/deploy/remote-deploy.sh \
            "${SSH_USER}@${SSH_HOST}:~/zonix-deploy/deploy/"

      - name: Deploy (pull images and restart the stack)
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}:${{ needs.build-and-push.outputs.short_sha }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}:${{ needs.build-and-push.outputs.short_sha }}
        run: |
          ssh -i "${HOME}/.ssh/zonix_deploy" -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_ROOT=\$HOME/zonix-deploy BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' \
             bash \$HOME/zonix-deploy/deploy/remote-deploy.sh"

      # R7: this must hit the actually-deployed server over its public HTTPS
      # FQDN, from the runner - not a check running on the VM itself.
      - name: Verify the public site is healthy
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused \
            "https://${SSH_HOST}/api/db-health"
