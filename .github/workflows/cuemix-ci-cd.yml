name: Cuemix CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: >-
          Full commit SHA to roll back production to (redeploys its
          already-published ghcr.io images, no rebuild -- see the
          rollback-production job). Leave blank for a normal manual run.
        required: false
        type: string
      run_backup_drill:
        description: >-
          Run a live backup/restore drill against production (see the
          backup-restore-drill job) instead of a normal run. Restores into
          a scratch database/volume only -- production is never touched.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A manual workflow_dispatch run (rollback or backup-restore-drill) must
# never cancel, or be cancelled by, an ordinary push/PR run on the same
# ref/branch -- github.ref is "refs/heads/main" for *both* a push to main
# and a workflow_dispatch launched against main, so a single ref-keyed
# group here would let a one-off manual dispatch silently cancel an
# in-flight push's tests/build/publish/deploy (observed live: a rollback
# dispatch cancelled the push pipeline for the commit that introduced this
# very fix, before its images had published). Every workflow_dispatch run
# gets its own unique group (keyed by run_id, so it never collides with
# anything and cancel-in-progress is moot for it); push/PR runs keep the
# original ref-keyed group with cancel-in-progress, so a newer push to the
# same branch/PR still cancels an older, now-stale one as before.
concurrency:
  group: >-
    cuemix-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    # Without this, a hang (asyncio/thread deadlock, a stuck network call)
    # falls back to GitHub's default 6-hour job timeout and silently burns
    # CI minutes for hours before anyone notices -- see channel_hub.py's
    # stop_listener()/pubsub.close() fix for a real one this caught. The
    # suite normally finishes in under 10 minutes; 15 leaves headroom
    # without masking a real hang for long.
    timeout-minutes: 15
    # A manual run dispatched to perform a rollback (rollback_sha set) or a
    # backup/restore drill (run_backup_drill true) only needs its own job
    # below -- skip the normal test/build/publish chain rather than running
    # it pointlessly.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.rollback_sha == '' && inputs.run_backup_drill != true)
    defaults:
      run:
        working-directory: Project/backend
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: cuemix_test
          POSTGRES_USER: cuemix_ci
          POSTGRES_PASSWORD: cuemix_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuemix_ci -d cuemix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Backs upload_queue.py's durable job store (crash-recovery, retry,
      # cancel) -- without this, those tests would either silently no-op
      # (fail-open, same posture as an unconfigured Redis in production) or
      # be skipped outright, so durability regressions would never be
      # caught in CI.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://cuemix_ci:cuemix_ci_password@localhost:5432/cuemix_test
      DATABASE_URL_LOCAL: postgresql+psycopg2://cuemix_ci:cuemix_ci_password@localhost:5432/cuemix_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      COOKIE_SECURE: "false"
      BACKEND_PUBLIC_URL: /api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Project/backend/requirements.txt
            Project/backend/requirements-dev.txt

      # AudioRenderer (pydub) shells out to ffmpeg for anything beyond plain
      # WAV, and the analysis job's librosa/soundfile path uses it for
      # compressed catalog uploads. ubuntu-latest ships it already; installed
      # explicitly so this doesn't silently start failing on a runner-image change.
      - name: Ensure ffmpeg is available
        id: ffmpeg-check
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present (runner image default)"
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compute today's date for the apt cache key
        if: steps.ffmpeg-check.outputs.needed == 'true'
        id: apt-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"

      # A real run of this job was found cancelled mid-`apt-get update`
      # (run 32158078794) -- confirmed from its own annotation ("Canceling
      # since a higher priority waiting request... exists") that this was
      # this workflow's own cancel-in-progress concurrency policy
      # superseding it on a rapid follow-up push, working exactly as
      # designed (see that policy's own comment above), not a bug or a real
      # ffmpeg failure. Separately, but from the same run's log: apt-get
      # update itself was independently slow/flaky, visibly retrying for
      # several seconds against azure.archive.ubuntu.com (a documented
      # quirk of GitHub's Azure-hosted runners) before falling back to
      # archive.ubuntu.com. Caching both the downloaded .deb archives and
      # the package index itself means a same-day run skips apt-get update
      # entirely -- the actual slow/flaky part -- shrinking the window a
      # coincidental supersede can land in, without touching the
      # concurrency policy itself. A day-keyed (not permanent) cache still
      # refreshes the index at least once every 24h.
      - name: Cache apt package lists and archives for ffmpeg
        if: steps.ffmpeg-check.outputs.needed == 'true'
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /var/lib/apt/lists
            !/var/lib/apt/lists/lock
            !/var/lib/apt/lists/partial
          key: apt-ffmpeg-${{ runner.os }}-${{ steps.apt-cache-date.outputs.date }}

      - name: Install ffmpeg
        if: steps.ffmpeg-check.outputs.needed == 'true'
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          fi
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply and validate database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run backend tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Project/backend/coverage.xml
          if-no-files-found: ignore

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    # Same reasoning as backend-tests' own timeout-minutes (see its
    # comment) -- this job had NONE until a real run of `npx playwright
    # install --with-deps chromium` genuinely hung (not just slow-retried:
    # zero log output for 50+ minutes) against apt-get's own dependency
    # install, only noticed and stopped by a human watching it live rather
    # than any automated guard. Without this, that silently burns CI
    # minutes for up to GitHub's default 6-hour job timeout. The suite
    # normally finishes in under 10 minutes.
    timeout-minutes: 15
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.rollback_sha == '' && inputs.run_backup_drill != true)
    defaults:
      run:
        working-directory: Project/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Project/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check types and Svelte components
        run: npm run check

      - name: Run frontend tests
        run: npm test

      - name: Check formatting and lint rules
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build production frontend
        run: npm run build

      - name: Compute today's date for the apt cache key
        id: apt-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"

      # `playwright install --with-deps` bundles its own `apt-get update` +
      # `apt-get install` for Chromium's OS-level dependencies -- this was
      # the actual step observed hanging for 50+ minutes with zero log
      # output (see frontend-checks' own timeout-minutes comment), the
      # same underlying apt/mirror class of issue as backend-tests'
      # Ensure-ffmpeg step (see that job's own comment for the confirmed
      # root cause there). Split into install-deps (apt) + install (browser
      # binary) so the apt portion can share that same day-keyed cache.
      - name: Cache apt package lists and archives for Chromium's dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /var/lib/apt/lists
            !/var/lib/apt/lists/lock
            !/var/lib/apt/lists/partial
          key: apt-playwright-chromium-${{ runner.os }}-${{ steps.apt-cache-date.outputs.date }}

      - name: Install the Chromium test browser
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          fi
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Run production browser smoke tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failures
          path: Project/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Real-time delivery, against a REAL backend+Postgres+Redis -- added
  # after a real production incident (see docker-compose.prod.yml's own
  # comment on backend's redis dependency) that every existing e2e test
  # would have missed, since they all mock the WebSocket/API boundary
  # (frontend-checks' smoke.spec.js). See
  # frontend/e2e/realtime-integration.spec.js's own module docstring for
  # exactly why a mocked WS test structurally cannot catch this class of
  # bug: it proves the Svelte code applies an incoming frame correctly,
  # never that the backend actually published one over real Redis.
  #
  # Deliberately NOT a dependency of container-builds/publish-images/
  # deploy-production: it adds real wall-clock (a second Postgres+Redis
  # bring-up, a second frontend build with a different PUBLIC_API_BASE_URL,
  # two extra Playwright browser contexts per test) on top of an already
  # substantial pipeline, and introduces its own new sources of
  # environmental flakiness (a live multi-worker backend, real Redis pub/
  # sub timing) that the deploy gate itself doesn't need to depend on --
  # the actual deployed app's health is already verified for real by
  # deploy-production's own db-health check. Runs on every push so it's
  # real CI signal, not a local-only script nobody re-runs, but if its
  # added time/flakiness becomes a real problem in practice, moving it to
  # a nightly schedule (or a pre-deploy manual gate) rather than every push
  # is the natural next step -- flagged here, not decided unilaterally.
  realtime-e2e:
    name: Real-time delivery E2E (real backend, 2 browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.rollback_sha == '' && inputs.run_backup_drill != true)
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: cuemix_realtime_e2e
          POSTGRES_USER: cuemix_ci
          POSTGRES_PASSWORD: cuemix_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuemix_ci -d cuemix_realtime_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://cuemix_ci:cuemix_ci_password@localhost:5432/cuemix_realtime_e2e
      DATABASE_URL_LOCAL: postgresql+psycopg2://cuemix_ci:cuemix_ci_password@localhost:5432/cuemix_realtime_e2e
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      # Real bug found via this job's own first run: an empty
      # BACKEND_PUBLIC_URL makes public_api_url() return a bare,
      # unprefixed path ("/uploads/1"), which the frontend's
      # backendMediaUrl() can't recognize (it only rewrites "/api/"-
      # prefixed or absolute dev-backend URLs) -- media links resolved
      # against the *frontend's* own origin instead of the backend's,
      # 404ing (observed live: "[WebServer] [404] GET /uploads/1"). Must
      # match PUBLIC_API_BASE_URL below exactly, so backendMediaUrl's
      # isDevelopmentBackend check (hostname/port match) recognizes it.
      BACKEND_PUBLIC_URL: http://127.0.0.1:5000
      ROOT_PATH: ""
      CORS_ORIGINS: http://127.0.0.1:4173
      ENABLE_COLD_SEED: "false"
      VIBE_LLM_PROVIDER: "none"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Project/backend/requirements.txt
            Project/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: Project/backend
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply database migrations
        working-directory: Project/backend
        run: python -m alembic upgrade head

      # --workers 1, not 2: this job's own first real run found /ws
      # consistently returning 404 on WebSocket handshake (confirmed from
      # the Playwright trace's network log -- "Error during WebSocket
      # handshake: Unexpected response code: 404" -- not an auth/origin
      # rejection, which would be 401/403) while ordinary HTTP endpoints on
      # the same server worked fine. --workers 2 was originally chosen as a
      # deliberately *stronger* test than production's real config (see
      # redis_client.py's own comment: "Production only ever has one loop
      # for the process's whole lifetime (BACKEND_WORKERS=1)") on the
      # theory that channel_hub.py's Redis-pub/sub delivery never takes an
      # in-process shortcut regardless of worker count -- but that's a
      # claim about *delivery*, not about whether uvicorn's own
      # multi-worker mode serves a WebSocket route correctly at all, which
      # this codebase has apparently never actually exercised (nothing
      # here runs uvicorn with workers>1 anywhere else). Reverted to
      # exactly production's own real, tested configuration rather than
      # debug an untested one -- if multi-worker WS support is worth
      # verifying, that's a separate, deliberate investigation, not a
      # side effect of this test's own setup.
      - name: Start the real backend
        working-directory: Project/backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 5000 --workers 1 \
            > "${RUNNER_TEMP}/backend.log" 2>&1 &
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/db-health >/dev/null 2>&1; then
              echo "Backend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Backend never became healthy -- log follows:" >&2
          cat "${RUNNER_TEMP}/backend.log" >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Project/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Project/frontend
        run: npm ci

      # A separate build from frontend-checks' own (which deliberately
      # builds against the default same-origin /api proxy, since its tests
      # mock that boundary) -- PUBLIC_API_BASE_URL is a Vite build-time
      # constant (import.meta.env), not a runtime setting, so pointing the
      # real backend requires its own build, not just a different `preview`
      # invocation.
      - name: Build frontend against the real backend
        working-directory: Project/frontend
        env:
          PUBLIC_API_BASE_URL: http://127.0.0.1:5000
        run: npm run build

      - name: Compute today's date for the apt cache key
        id: apt-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"

      # Same fix, same reasoning, as frontend-checks' own identical step --
      # `--with-deps` was observed hanging for real (see that job's own
      # comment); split + day-cached so a hang there is both less likely
      # and, regardless, bounded by this job's own timeout-minutes.
      - name: Cache apt package lists and archives for Chromium's dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /var/lib/apt/lists
            !/var/lib/apt/lists/lock
            !/var/lib/apt/lists/partial
          key: apt-playwright-chromium-${{ runner.os }}-${{ steps.apt-cache-date.outputs.date }}

      - name: Install the Chromium test browser
        working-directory: Project/frontend
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          fi
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Run real-time delivery E2E tests
        working-directory: Project/frontend
        env:
          PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:5000
        run: npx playwright test e2e/realtime-integration.spec.js

      - name: Show backend log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/backend.log" || true

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-e2e-failures
          path: Project/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  container-builds:
    name: Container builds
    runs-on: ubuntu-latest
    # Every job in this workflow gets an explicit timeout now (see
    # frontend-checks' own comment for the real hang that exposed this gap
    # across the board, not just there) -- a full Docker build of both
    # images, even cold-cache, comfortably fits well inside this.
    timeout-minutes: 20
    needs: [backend-tests, frontend-checks]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --file Project/docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        env:
          BACKEND_IMAGE: ghcr.io/example/cuemix-backend:validation
          FRONTEND_IMAGE: ghcr.io/example/cuemix-frontend:validation
        run: >-
          docker compose
          --env-file Project/deploy/.env.production.example
          --file Project/docker-compose.prod.yml
          config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: Project/backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: Project/frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish-images:
    name: Publish immutable images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [container-builds]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.metadata.outputs.backend_image }}
      frontend_image: ${{ steps.metadata.outputs.frontend_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image names
        id: metadata
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${owner}/cuemix-backend:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=ghcr.io/${owner}/cuemix-frontend:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: Project/backend
          push: true
          tags: ${{ steps.metadata.outputs.backend_image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: Project/frontend
          push: true
          tags: ${{ steps.metadata.outputs.frontend_image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-production:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    # Generous relative to the others: includes an Ollama model pull/warm-up
    # over SSH on the VM (remote-deploy.sh's own bounded wait/retry loops),
    # not just this runner's own work.
    timeout-minutes: 25
    needs: [publish-images]
    # Separate from DEPLOY_ENABLED (which only gates publishing images to
    # GHCR): this VM belongs to the course, not the team, and the one-time
    # `.env` + Docker setup on it isn't done yet. Leaving this variable unset
    # keeps CI green (tests run, images publish) without touching the VM.
    # Flip vars.VM_DEPLOY_ENABLED to "true" once that VM setup is complete.
    if: needs.publish-images.result == 'success' && vars.VM_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          for name in SSH_HOST SSH_USER GHCR_USERNAME PUBLIC_BASE_URL SSH_PRIVATE_KEY GHCR_READ_TOKEN; do
            test -n "${!name:-}" || { echo "${name} is not configured" >&2; exit 1; }
          done
          case "${PUBLIC_BASE_URL}" in
            https://*) ;;
            *) echo "PUBLIC_BASE_URL must start with https://" >&2; exit 1 ;;
          esac

      # Host keys are trusted on first connect (TOFU) rather than pinned via a
      # verified SSH_KNOWN_HOSTS secret. The runner is ephemeral, so this is a
      # deliberate simplicity trade-off, not an oversight: accept-new still
      # rejects a key that changes mid-job, it just does not protect against a
      # MITM on the very first connection.
      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/cuemix_deploy"
          chmod 600 "${HOME}/.ssh/cuemix_deploy"
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ${HOME}/.ssh/known_hosts"
          } > "${HOME}/.ssh/config"
          chmod 600 "${HOME}/.ssh/config"

      - name: Upload deployment definitions
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/cuemix-deploy/deploy"
          scp -i "${HOME}/.ssh/cuemix_deploy" Project/docker-compose.prod.yml "${SSH_USER}@${SSH_HOST}:~/cuemix-deploy/"
          scp -i "${HOME}/.ssh/cuemix_deploy" Project/deploy/Caddyfile Project/deploy/remote-deploy.sh Project/deploy/backup.sh Project/deploy/restore.sh Project/deploy/backup-restore-drill.sh "${SSH_USER}@${SSH_HOST}:~/cuemix-deploy/deploy/"

      - name: Log the VM in to GHCR
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "${GHCR_READ_TOKEN}" | ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Apply migration and deploy
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          BACKEND_IMAGE: ${{ needs.publish-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.publish-images.outputs.frontend_image }}
        run: |
          ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_ROOT=\$HOME/cuemix-deploy BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' bash \$HOME/cuemix-deploy/deploy/remote-deploy.sh"

      # --retry-all-errors is required, not optional: on a first-ever deploy
      # Caddy needs a few seconds to obtain the Let's Encrypt certificate, and
      # curl treats a TLS handshake failure (exit 35) as non-transient, so
      # plain --retry will not retry it and the check fails spuriously.
      - name: Verify the public TLS database health endpoint
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: >-
          curl --fail --show-error
          --retry 12 --retry-delay 5 --retry-all-errors --retry-connrefused
          --max-time 30
          "${PUBLIC_BASE_URL%/}/api/db-health"

      # Catches the exact failure mode a real deploy once had silently: the
      # /static StaticFiles mount 404ing for every request behind the
      # /api-stripping reverse proxy (see app/main.py's FastAPI() call site
      # for the root-cause writeup) had no automated check that would have
      # caught it before a human noticed. db-health alone doesn't cover this
      # -- it's a completely different route type (a plain @app.get, not a
      # Mount), so it stayed green throughout. --fail makes any non-2xx here
      # fail the job the same way the health check above does.
      - name: Verify a real static asset is actually reachable
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: >-
          curl --fail --show-error
          --retry 12 --retry-delay 5 --retry-all-errors --retry-connrefused
          --max-time 30
          "${PUBLIC_BASE_URL%/}/api/static/audio/cuemix-demo.wav"
          --output /dev/null

  rollback-production:
    name: Roll back Azure VM to a prior SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Manual only: redeploys images that were already published for
    # `rollback_sha` (no rebuild) -- see deploy/README.md's Operations
    # section for the drill this was verified with. Independent of
    # publish-images/deploy-production, since a rollback deliberately skips
    # straight past building/testing the current ref.
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != '' && vars.VM_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Check out the rollback ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_sha }}

      - name: Validate rollback configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          for name in SSH_HOST SSH_USER GHCR_USERNAME PUBLIC_BASE_URL SSH_PRIVATE_KEY GHCR_READ_TOKEN; do
            test -n "${!name:-}" || { echo "${name} is not configured" >&2; exit 1; }
          done
          case "${PUBLIC_BASE_URL}" in
            https://*) ;;
            *) echo "PUBLIC_BASE_URL must start with https://" >&2; exit 1 ;;
          esac
          if ! [[ "${ROLLBACK_SHA}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "rollback_sha must be a 7-40 character hex commit SHA, got: ${ROLLBACK_SHA}" >&2
            exit 1
          fi

      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/cuemix_deploy"
          chmod 600 "${HOME}/.ssh/cuemix_deploy"
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ${HOME}/.ssh/known_hosts"
          } > "${HOME}/.ssh/config"
          chmod 600 "${HOME}/.ssh/config"

      # Uses the rollback ref's own copy of these files -- rolling back to an
      # older commit means running with its Compose/Caddy/deploy-script
      # definitions too, not the current ones layered onto old app images.
      - name: Upload deployment definitions from the rollback ref
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/cuemix-deploy/deploy"
          scp -i "${HOME}/.ssh/cuemix_deploy" Project/docker-compose.prod.yml "${SSH_USER}@${SSH_HOST}:~/cuemix-deploy/"
          scp -i "${HOME}/.ssh/cuemix_deploy" Project/deploy/Caddyfile Project/deploy/remote-deploy.sh Project/deploy/backup.sh Project/deploy/restore.sh Project/deploy/backup-restore-drill.sh "${SSH_USER}@${SSH_HOST}:~/cuemix-deploy/deploy/"

      - name: Log the VM in to GHCR
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "${GHCR_READ_TOKEN}" | ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Redeploy the rollback SHA's already-published images
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          backend_image="ghcr.io/${owner}/cuemix-backend:${{ inputs.rollback_sha }}"
          frontend_image="ghcr.io/${owner}/cuemix-frontend:${{ inputs.rollback_sha }}"
          echo "Rolling back to ${backend_image} / ${frontend_image}"
          ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_ROOT=\$HOME/cuemix-deploy BACKEND_IMAGE='${backend_image}' FRONTEND_IMAGE='${frontend_image}' bash \$HOME/cuemix-deploy/deploy/remote-deploy.sh"

      - name: Verify the public TLS database health endpoint
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: >-
          curl --fail --show-error
          --retry 12 --retry-delay 5 --retry-all-errors --retry-connrefused
          --max-time 30
          "${PUBLIC_BASE_URL%/}/api/db-health"

  backup-restore-drill:
    name: Backup/restore drill against production
    runs-on: ubuntu-latest
    # Generous: a real pg_dump/restore against production-scale data, not a
    # cheap operation -- see this job's own step for real timing to tune.
    timeout-minutes: 30
    # Manual only, and mutually exclusive with rollback (each is its own
    # deliberate dispatch, not something to combine into one run -- if both
    # inputs are somehow set at once, rollback_sha wins and this is
    # skipped). Runs a real backup.sh and restore.sh against a scratch
    # database/volume on the VM -- production itself is never written to.
    # See deploy/README.md's Operations section and
    # deploy/backup-restore-drill.sh.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_backup_drill == true &&
      inputs.rollback_sha == '' && vars.VM_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate drill configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          for name in SSH_HOST SSH_USER GHCR_USERNAME PUBLIC_BASE_URL SSH_PRIVATE_KEY GHCR_READ_TOKEN; do
            test -n "${!name:-}" || { echo "${name} is not configured" >&2; exit 1; }
          done

      # Same TOFU host-key handling as deploy-production/rollback-production
      # -- see rollback-production's identical step for the trade-off note.
      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/cuemix_deploy"
          chmod 600 "${HOME}/.ssh/cuemix_deploy"
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ${HOME}/.ssh/known_hosts"
          } > "${HOME}/.ssh/config"
          chmod 600 "${HOME}/.ssh/config"

      # Refreshes deploy/backup-restore-drill.sh (and its siblings) on the
      # VM from this ref, same as every other job that talks to it --
      # never assumes whatever is already there is current.
      - name: Upload deployment definitions
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/cuemix-deploy/deploy"
          scp -i "${HOME}/.ssh/cuemix_deploy" Project/docker-compose.prod.yml "${SSH_USER}@${SSH_HOST}:~/cuemix-deploy/"
          scp -i "${HOME}/.ssh/cuemix_deploy" Project/deploy/Caddyfile Project/deploy/remote-deploy.sh Project/deploy/backup.sh Project/deploy/restore.sh Project/deploy/backup-restore-drill.sh "${SSH_USER}@${SSH_HOST}:~/cuemix-deploy/deploy/"

      # Captures stdout+stderr to a file instead of letting a failure
      # short-circuit the step immediately, so the *next* step can still
      # publish whatever the drill managed to print (including partial
      # progress on a failure) to the job summary -- then re-raises the
      # drill's own exit code so the job still fails correctly.
      - name: Run the backup/restore drill on the VM
        id: drill
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          set +e
          ssh -i "${HOME}/.ssh/cuemix_deploy" "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_ROOT=\$HOME/cuemix-deploy DRILL_ID='${{ github.run_id }}' bash \$HOME/cuemix-deploy/deploy/backup-restore-drill.sh" \
            > drill-output.txt 2>&1
          exit_code=$?
          cat drill-output.txt
          exit "${exit_code}"

      - name: Publish drill result to the job summary
        if: always()
        run: |
          {
            echo "### Backup/restore drill result: ${{ steps.drill.outcome }}"
            echo '```'
            cat drill-output.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
