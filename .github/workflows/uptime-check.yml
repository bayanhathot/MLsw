name: Uptime check

# Chosen over a third-party monitor (UptimeRobot/Better Uptime) so the whole
# check is self-contained in this repository, with no external account to
# provision -- see Project/README.md's Operations section for how to read
# results and what an off-VM/third-party monitor would add on top of this.

on:
  schedule:
    # Every 15 minutes. GitHub Actions can queue/delay scheduled runs under
    # load, so this is a "notice within roughly half an hour" check, not a
    # precise SLA measurement.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cuemix-uptime-check
  cancel-in-progress: false

jobs:
  check:
    name: Check production health endpoint
    runs-on: ubuntu-latest
    # PUBLIC_BASE_URL is configured and the VM is deployed (see
    # VM_DEPLOY_ENABLED in cuemix-ci-cd.yml), so this runs for real. The
    # guard is kept so this stays a no-op rather than a failure if that ever
    # changes -- same "keep CI green without a deployed target" principle.
    if: vars.PUBLIC_BASE_URL != ''
    steps:
      # /api/db-health returns HTTP 200 -- and so, until this, "healthy" --
      # even when its own redis.reachable field is false: a real incident
      # (redis's container was never (re)created by any deploy -- see
      # docker-compose.prod.yml's backend.depends_on.redis) ran undetected
      # by this check for that exact reason, since `curl --fail` only ever
      # looks at the HTTP status, never the response body. Parsing the body
      # here is the minimal fix that actually closes that gap, reusing the
      # same JSON this step already fetches rather than a second request.
      - name: Probe /api/db-health
        id: health
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          body="$(curl --fail --show-error --max-time 15 "${PUBLIC_BASE_URL%/}/api/db-health")" || {
            echo "healthy=false" >> "${GITHUB_OUTPUT}"
            echo "detail=request failed (non-2xx or network error)" >> "${GITHUB_OUTPUT}"
            exit 0
          }
          echo "${body}"
          redis_reachable="$(printf '%s' "${body}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("redis", {}).get("reachable"))' 2>/dev/null || echo "unknown")"
          if [ "${redis_reachable}" = "False" ]; then
            echo "healthy=false" >> "${GITHUB_OUTPUT}"
            echo "detail=redis.reachable is false: ${body}" >> "${GITHUB_OUTPUT}"
          else
            echo "healthy=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update an incident issue on failure
        if: steps.health.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production uptime check failed";
            const body = [
              `The scheduled uptime check found a problem at `,
              "`${{ vars.PUBLIC_BASE_URL }}/api/db-health` at ",
              new Date().toISOString(),
              `: ${{ steps.health.outputs.detail }}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("");

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime"
            });

            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["uptime"]
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body
              });
            }

      - name: Close any open incident issue on recovery
        if: steps.health.outputs.healthy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime"
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: the health endpoint responded successfully at ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }
