stages:
  evaluate-baseline:
    cmd: python ml_pipeline.py
    deps:
      - ml_pipeline.py
      - sample_segments.jsonl
    params:
      - baseline.prompt_overlap_weight
      - baseline.transition_weight
      - baseline.silence_penalty
      - evaluation.query
      - evaluation.top_k
      - evaluation.max_silence_probability
      - promotion.min_precision_at_k
      - promotion.min_mean_transition_score_at_k
      - promotion.required_catalog_integrity_rate
    outs:
      - ranked_segments.json:
          cache: false
    metrics:
      - metrics.json:
          cache: false
