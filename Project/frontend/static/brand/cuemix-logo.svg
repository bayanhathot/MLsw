<!--
  File: static/brand/cuemix-logo.svg
  Purpose: Public-URL copy of the Cuemix logo (served at /brand/cuemix-logo.svg),
  used wherever a plain URL is needed instead of a bundled Svelte import,
  e.g. AudioRenderer's now-playing cover fallback (session_manager.COVER_URL).
  Keep in sync with src/assets/cuemix-logo.svg.
  Note: the mark is two cue triangles facing each other, overlapping at their
  tips: "cue" (the exact point you drop into a track) plus "mix" (two
  sources blending into one), drawn from the product's own vocabulary rather
  than a generic waveform/play-button glyph.
-->
<svg width="220" height="64" viewBox="0 0 220 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cuemix logo</title>
  <desc id="desc">Cuemix wordmark with two overlapping cue-point triangles as its mark</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DB7FF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6F7CFF"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.23 0 0 0 0 0.51 0 0 0 0 0.96 0 0 0 0.32 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <rect x="0" y="8" width="48" height="48" rx="14" fill="url(#mark)"/>
    <path d="M11 18L11 46L29 32Z" fill="white" fill-opacity="0.97"/>
    <path d="M37 18L37 46L19 32Z" fill="white" fill-opacity="0.55"/>
  </g>
  <text x="66" y="42" fill="#F7FBFF" font-family="Outfit, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="9">CUEMIX</text>
</svg>
