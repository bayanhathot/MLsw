name: cuemix

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cuemix_user:cuemix_dev_password@postgres:5432/cuemix_db}
  SECRET_KEY: ${SECRET_KEY:-local-development-secret-replace-before-deploying}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-180}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-/api}
  ROOT_PATH: ${ROOT_PATH:-/api}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  # "none" here keeps local dev zero-friction (no LLM call made, even
  # though the ollama container below now starts by default); the app
  # itself defaults to "ollama", the sole LLM option, when this is unset
  # entirely.
  VIBE_LLM_PROVIDER: ${VIBE_LLM_PROVIDER:-none}
  # Defaults match the "ollama" service below, so VIBE_LLM_PROVIDER=ollama
  # works with no further configuration once qwen3:8b is pulled:
  # `docker compose exec ollama ollama pull qwen3:8b`.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-15}
  OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-4}
  # Qwen3's "thinking mode" adds real latency to the classification call and
  # is the likely cause of Ollama call timeouts on unconfirmed GPUs -- off by
  # default to reduce timeout risk; set to true once a deployment's GPU is
  # confirmed to handle it within OLLAMA_TIMEOUT_SECONDS.
  OLLAMA_THINK_ENABLED: ${OLLAMA_THINK_ENABLED:-false}
  # How long Ollama keeps the model resident in memory (server-level default,
  # also wired into the "ollama" service below); prompt_parser.py additionally
  # sends this on every request, which refreshes the timer per Ollama's own
  # docs. "-1" means never unload, avoiding the cold-reload-from-disk latency
  # a request otherwise pays after 5+ minutes of inactivity.
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
  UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
  UPLOAD_WORKERS: ${UPLOAD_WORKERS:-4}
  UPLOAD_QUEUE_CAPACITY: ${UPLOAD_QUEUE_CAPACITY:-32}
  UPLOAD_JOB_TTL_SECONDS: ${UPLOAD_JOB_TTL_SECONDS:-3600}
  ARTIST_MATCH_THRESHOLD: ${ARTIST_MATCH_THRESHOLD:-0.3}
  ENABLE_PIPELINE_DEBUG: ${ENABLE_PIPELINE_DEBUG:-false}

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuemix_db}
      POSTGRES_USER: ${POSTGRES_USER:-cuemix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuemix_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  uploads-init:
    build:
      context: ./backend
    user: "0:0"
    command: ["/bin/sh", "-c", "mkdir -p /data/uploads && chown 10001:10001 /data/uploads"]
    volumes:
      - uploads_data:/data/uploads
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    init: true
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/db-health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  adminer:
    image: adminer:5.5.0-standalone
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.11.4
    environment:
      # Ollama's own server-level env var (read natively by the ollama
      # binary) -- same value as the backend's copy above, kept in sync so
      # the container-level default and prompt_parser.py's per-request
      # override agree.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
