# docker-compose.yml
#
# This file defines the local development infrastructure for Zonix.
# Instead of running frontend, backend, and database manually,
# Docker Compose starts them together with one command:
#
#   docker compose up --build
#
# Services in this file:
# 1. frontend  -> the web UI
# 2. backend   -> the FastAPI server
# 3. postgres  -> the PostgreSQL database
# 4. adminer   -> a browser UI for inspecting the database

services:
  # -----------------------------
  # Frontend service
  # -----------------------------
  frontend:
    # Build the frontend image using the Dockerfile inside ./frontend
    build:
      context: ./frontend

    # Human-readable container name
    container_name: zonix-frontend

    # Map port 8080 on your computer to port 80 inside the frontend container.
    # Browser URL:
    #   http://localhost:8080
    ports:
      - "8080:80"

    # Start backend before frontend.
    # This does not mean backend is fully ready;
    # it only controls startup order.
    depends_on:
      - backend

    # Restart automatically unless you manually stop it.
    restart: unless-stopped

  # -----------------------------
  # Backend service
  # -----------------------------
  backend:
    # Build the backend image using the Dockerfile inside ./backend
    build:
      context: ./backend

    # Human-readable container name
    container_name: zonix-backend

    # Map port 5000 on your computer to port 5000 inside the backend container.
    # Backend URL:
    #   http://localhost:5000
    ports:
      - "5000:5000"

    # Load environment variables from the .env file.
    # This gives the backend access to DATABASE_URL.
    env_file:
      - .env

    # Wait for PostgreSQL to become healthy before starting backend.
    # This is better than simple depends_on because PostgreSQL may need
    # a few seconds before it can accept connections.
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  # -----------------------------
  # PostgreSQL database service
  # -----------------------------
  postgres:
    # Use the official PostgreSQL version 16 image.
    image: postgres:16

    # Human-readable container name
    container_name: zonix-postgres

    restart: unless-stopped

    # PostgreSQL reads POSTGRES_DB, POSTGRES_USER, and POSTGRES_PASSWORD
    # from the .env file when the container is first created.
    env_file:
      - .env

    # Map the PostgreSQL port from container to host.
    #
    # PostgreSQL default internal port is 5432.
    # POSTGRES_PORT is defined in .env.
    #
    # This lets tools on your computer connect through localhost:5432.
    ports:
      - "${POSTGRES_PORT}:5432"

    # Persist database files in a Docker-managed volume.
    #
    # Without this, database data could disappear when the container is removed.
    # The database stores its internal files at /var/lib/postgresql/data.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Healthcheck asks PostgreSQL:
    # "Are you ready to accept connections?"
    #
    # pg_isready is a PostgreSQL command-line tool.
    # Docker uses this to decide when the database is healthy.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------
  # Adminer database UI service
  # -----------------------------
  adminer:
    # Adminer is a lightweight database management UI.
    # It lets us inspect PostgreSQL from the browser.
    image: adminer:latest

    container_name: zonix-adminer

    restart: unless-stopped

    # Adminer runs on port 8080 inside the container.
    # We expose it as localhost:8081 on our computer.
    #
    # Adminer URL:
    #   http://localhost:8081
    ports:
      - "8081:8080"

    # Adminer should start only after PostgreSQL is healthy.
    depends_on:
      postgres:
        condition: service_healthy

# -----------------------------
# Docker volumes
# -----------------------------
volumes:
  # Docker-managed persistent storage for PostgreSQL data.
  # This keeps the database data after container restarts.
  postgres_data: