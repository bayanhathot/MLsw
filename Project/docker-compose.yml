name: cuemix

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cuemix_user:cuemix_dev_password@postgres:5432/cuemix_db}
  SECRET_KEY: ${SECRET_KEY:-local-development-secret-replace-before-deploying}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-180}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-/api}
  ROOT_PATH: ${ROOT_PATH:-/api}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  # Backs upload_queue.py's durable job store and channel_hub.py's
  # real-time WebSocket fan-out (chat/notifications/live feed/media) --
  # see app/core/redis_client.py. Both fail open (degrade silently rather
  # than crash) when this is unreachable, which is exactly what let a real
  # production outage go unnoticed -- see docker-compose.prod.yml's own
  # comment on backend's redis dependency.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  # Ollama is the sole LLM option and is enabled locally by default. The
  # one-shot ollama-model-init service below automatically pulls and warms
  # the configured model before the backend or Studio AI starts.
  VIBE_LLM_PROVIDER: ${VIBE_LLM_PROVIDER:-ollama}
  # Defaults match the Ollama server and automatic model initializer below.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-15}
  OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-4}
  # Qwen3's "thinking mode" adds real latency to the classification call and
  # is the likely cause of Ollama call timeouts on unconfirmed GPUs -- off by
  # default to reduce timeout risk; set to true once a deployment's GPU is
  # confirmed to handle it within OLLAMA_TIMEOUT_SECONDS.
  OLLAMA_THINK_ENABLED: ${OLLAMA_THINK_ENABLED:-false}
  # How long Ollama keeps the model resident in memory (server-level default,
  # also wired into the "ollama" service below); prompt_parser.py additionally
  # sends this on every request, which refreshes the timer per Ollama's own
  # docs. "-1" means never unload, avoiding the cold-reload-from-disk latency
  # a request otherwise pays after 5+ minutes of inactivity.
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
  UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
  UPLOAD_WORKERS: ${UPLOAD_WORKERS:-4}
  UPLOAD_QUEUE_CAPACITY: ${UPLOAD_QUEUE_CAPACITY:-32}
  UPLOAD_JOB_TTL_SECONDS: ${UPLOAD_JOB_TTL_SECONDS:-3600}
  CATALOG_AUDIO_MAX_MB_COMPRESSED: ${CATALOG_AUDIO_MAX_MB_COMPRESSED:-30}
  CATALOG_AUDIO_MAX_MB_LOSSLESS: ${CATALOG_AUDIO_MAX_MB_LOSSLESS:-100}
  CATALOG_BATCH_PRIORITY_DECAY_EVERY: ${CATALOG_BATCH_PRIORITY_DECAY_EVERY:-3}
  ARTIST_MATCH_THRESHOLD: ${ARTIST_MATCH_THRESHOLD:-0.3}
  # Debug mode is on by default everywhere right now (local and prod) --
  # see docker-compose.prod.yml's copy of this comment for why.
  ENABLE_PIPELINE_DEBUG: ${ENABLE_PIPELINE_DEBUG:-true}
  # Cold-seeds a realistic ~50-user dataset on every deploy (see
  # app/coldseed/build.py) -- idempotent, so safe to leave on. Set to false
  # to opt out.
  ENABLE_COLD_SEED: ${ENABLE_COLD_SEED:-true}
  COLD_SEED_VERSION: ${COLD_SEED_VERSION:-v1}
  COLD_SEED_RANDOM_SEED: ${COLD_SEED_RANDOM_SEED:-2026}
  # Gates live Audius audio fetch for the persistent analysis cache -- see
  # Project/SECURITY.md's "Third-party compliance gates" section and
  # docker-compose.prod.yml's own copy of this comment.
  AUDIUS_ANALYSIS_CACHE_ENABLED: ${AUDIUS_ANALYSIS_CACHE_ENABLED:-true}
  EXTERNAL_ANALYSIS_MAX_ATTEMPTS: ${EXTERNAL_ANALYSIS_MAX_ATTEMPTS:-3}
  # Gates the admin debug dashboard -- see docker-compose.prod.yml's own
  # copy of this comment.
  DEBUG_DASHBOARD_ENABLED: ${DEBUG_DASHBOARD_ENABLED:-true}
  STUDIO_ENABLED: ${STUDIO_ENABLED:-true}
  STUDIO_AI_URL: ${STUDIO_AI_URL:-http://studio-ai-service:8001}
  STUDIO_AI_TIMEOUT_SECONDS: ${STUDIO_AI_TIMEOUT_SECONDS:-250}
  STUDIO_AI_INTERNAL_TOKEN: ${STUDIO_AI_INTERNAL_TOKEN:-}
  STUDIO_MIN_SEGMENT_MS: ${STUDIO_MIN_SEGMENT_MS:-1000}
  STUDIO_MAX_SEGMENT_MS: ${STUDIO_MAX_SEGMENT_MS:-300000}

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuemix_db}
      POSTGRES_USER: ${POSTGRES_USER:-cuemix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuemix_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["/bin/sh", "-c", "python -m alembic upgrade head && python -m app.seed"]
    # The cold seed (app/seed.py) writes real files under UPLOAD_DIR (staged
    # catalog audio, placeholder attachment images) -- it needs the same
    # persistent volume backend serves them from, not this container's own
    # throwaway filesystem, and needs to run after uploads-init has created
    # and chowned that directory (same ordering backend itself waits on).
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  uploads-init:
    build:
      context: ./backend
    user: "0:0"
    command: ["/bin/sh", "-c", "mkdir -p /data/uploads && chown 10001:10001 /data/uploads"]
    volumes:
      - uploads_data:/data/uploads
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    init: true
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
      # Same missing dependency the production compose file had (fixed
      # there for a real outage -- see docker-compose.prod.yml's own
      # comment on this line): redis had no dependents anywhere in this
      # file either, so a plain `docker compose up` with no service filter
      # is fine, but `docker compose up backend` (or any subset that
      # doesn't happen to also name redis) would never create it.
      redis:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/db-health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  studio-ai-service:
    build:
      context: .
      dockerfile: studio-ai-service/Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      STUDIO_AI_KEEP_ALIVE: ${STUDIO_AI_KEEP_ALIVE:--1}
      STUDIO_AI_THINK_ENABLED: "true"
      OLLAMA_QUEUE_WAIT_SECONDS: ${OLLAMA_QUEUE_WAIT_SECONDS:-2}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-4}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STUDIO_AI_MODEL_TIMEOUT_SECONDS: ${STUDIO_AI_MODEL_TIMEOUT_SECONDS:-240}
      STUDIO_AI_MAX_CONTEXT_ITEMS: ${STUDIO_AI_MAX_CONTEXT_ITEMS:-30}
      STUDIO_AI_MAX_OUTPUT_TOKENS: ${STUDIO_AI_MAX_OUTPUT_TOKENS:-700}
      STUDIO_AI_TEMPERATURE: ${STUDIO_AI_TEMPERATURE:-0.15}
      STUDIO_AI_INTERNAL_TOKEN: ${STUDIO_AI_INTERNAL_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    expose:
      - "8001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  adminer:
    image: adminer:5.5.0-standalone
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.11.4
    environment:
      # Ollama's own server-level env var (read natively by the ollama
      # binary) -- same value as the backend's copy above, kept in sync so
      # the container-level default and prompt_parser.py's per-request
      # override agree.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Provision the local model without any manual `ollama pull` step. This
  # uses the Ollama image only as a CLI client connected to the real server.
  # `ollama pull` is idempotent, so an existing ollama_data volume only pays
  # for a fast manifest check; a fresh installation downloads the model once.
  # Warming it here also means Studio's strict /ready check can succeed as
  # soon as the application services start.
  ollama-model-init:
    image: ollama/ollama:0.11.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        model="$${OLLAMA_MODEL:-qwen3:8b}"
        echo "ollama-model-init: ensuring $${model} is installed..."
        ollama pull "$${model}"
        echo "ollama-model-init: warming $${model}..."
        ollama run "$${model}" "Respond with only: ok" >/dev/null
        echo "ollama-model-init: $${model} is ready."
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
  redis_data:
