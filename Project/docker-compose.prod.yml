name: cuemix-production

x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  BACKEND_PUBLIC_URL: /api
  ROOT_PATH: /api
  CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
  # The backend is internal-only and Caddy replaces client-forwarding headers.
  TRUST_PROXY_HEADERS: "true"
  UPLOAD_DIR: /data/uploads
  UPLOAD_WORKERS: ${UPLOAD_WORKERS:-4}
  UPLOAD_QUEUE_CAPACITY: ${UPLOAD_QUEUE_CAPACITY:-32}
  UPLOAD_JOB_TTL_SECONDS: ${UPLOAD_JOB_TTL_SECONDS:-3600}
  CATALOG_AUDIO_MAX_MB_COMPRESSED: ${CATALOG_AUDIO_MAX_MB_COMPRESSED:-30}
  CATALOG_AUDIO_MAX_MB_LOSSLESS: ${CATALOG_AUDIO_MAX_MB_LOSSLESS:-100}
  CATALOG_BATCH_PRIORITY_DECAY_EVERY: ${CATALOG_BATCH_PRIORITY_DECAY_EVERY:-3}
  ARTIST_MATCH_THRESHOLD: ${ARTIST_MATCH_THRESHOLD:-0.3}
  # Internal AI-DJ pipeline / Ollama debug panel. Off by default; keep it off
  # unless an operator is actively debugging, even though it also requires a
  # logged-in user.
  ENABLE_PIPELINE_DEBUG: ${ENABLE_PIPELINE_DEBUG:-false}
  # Ollama is the sole LLM option and the production default: fully local,
  # no hosted-API key to provision. Set VIBE_LLM_PROVIDER=none to skip the
  # LLM step entirely instead.
  VIBE_LLM_PROVIDER: ${VIBE_LLM_PROVIDER:-ollama}
  # Defaults match the "ollama" service below, so VIBE_LLM_PROVIDER=ollama
  # works with no further configuration once qwen3:8b is pulled.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-15}
  OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-4}
  # Qwen3's "thinking mode" adds real latency to the classification call and
  # is the likely cause of Ollama call timeouts on unconfirmed GPUs -- off by
  # default to reduce timeout risk; set to true once a deployment's GPU is
  # confirmed to handle it within OLLAMA_TIMEOUT_SECONDS.
  OLLAMA_THINK_ENABLED: ${OLLAMA_THINK_ENABLED:-false}
  # How long Ollama keeps the model resident in memory (server-level default,
  # also wired into the "ollama" service below); prompt_parser.py additionally
  # sends this on every request, which refreshes the timer per Ollama's own
  # docs. "-1" means never unload, avoiding the cold-reload-from-disk latency
  # a request otherwise pays after 5+ minutes of inactivity.
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
  # Not yet used by any app code -- purely additive infrastructure, see
  # app/core/redis_client.py.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  # Cold-seeds a realistic ~50-user dataset on every deploy (see
  # app/coldseed/build.py) -- idempotent, so safe to leave on. Set to false
  # to opt out.
  ENABLE_COLD_SEED: ${ENABLE_COLD_SEED:-true}
  COLD_SEED_VERSION: ${COLD_SEED_VERSION:-v1}
  COLD_SEED_RANDOM_SEED: ${COLD_SEED_RANDOM_SEED:-2026}

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    environment: *backend-environment
    command: ["/bin/sh", "-c", "python -m alembic upgrade head && python -m app.seed"]
    # The cold seed (app/seed.py) writes real files under UPLOAD_DIR (staged
    # catalog audio, placeholder attachment images) -- it needs the same
    # persistent volume backend serves them from, not this container's own
    # throwaway filesystem, and needs to run after uploads-init has created
    # and chowned that directory (same ordering backend itself waits on).
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  uploads-init:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    user: "0:0"
    command: ["/bin/sh", "-c", "mkdir -p /data/uploads && chown 10001:10001 /data/uploads"]
    volumes:
      - uploads_data:/data/uploads
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # Fully local VibeUnderstander refinement (VIBE_LLM_PROVIDER=ollama, the
  # default). Runs regardless of which provider is selected, same as
  # postgres, so it's ready even if VIBE_LLM_PROVIDER=none is set instead.
  # qwen3:8b is not bundled in the image; deploy/remote-deploy.sh pulls it
  # automatically after this service comes up (idempotent, safe on every
  # deploy). Manual pull is only needed outside that script, e.g. a local
  # `docker compose up`: `docker compose exec ollama ollama pull qwen3:8b`.
  ollama:
    image: ollama/ollama:0.11.4
    environment:
      # Ollama's own server-level env var (read natively by the ollama
      # binary) -- same value as the backend's copy above, kept in sync so
      # the container-level default and prompt_parser.py's per-request
      # override agree.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # remote-deploy.sh's own pull/warm-up step only runs during an actual
  # push-triggered deploy (see cuemix-ci-cd.yml: `on: push`) -- it never
  # fires on a plain VM reboot or `docker compose restart ollama`. Since
  # `ollama` above uses `restart: unless-stopped`, a restart brings the
  # container back with the model file still on the persisted `ollama_data`
  # volume but nothing loaded into memory, and nothing re-checks it: the app
  # silently reverts to the deterministic prompt-parse fallback until the
  # next deploy or a manual `ollama pull`/`ollama run`. This sidecar is the
  # backstop for exactly that gap -- it doesn't run its own server (reuses
  # the same image purely for its `ollama` CLI, pointed at the real server
  # via OLLAMA_HOST instead of starting one with `ollama serve`) and loops
  # forever, self-healing on every start and periodically thereafter so a
  # model that silently drops out mid-run also gets reloaded, not just once
  # at boot.
  ollama-keepalive:
    image: ollama/ollama:0.11.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        model="$${OLLAMA_MODEL:-qwen3:8b}"
        echo "ollama-keepalive: watching over $${model} on $${OLLAMA_HOST}"
        while true; do
          if ollama list >/dev/null 2>&1; then
            if ! ollama list | awk '{print $$1}' | grep -qxF "$${model}"; then
              echo "ollama-keepalive: $${model} missing, pulling..."
              ollama pull "$${model}" || echo "ollama-keepalive: pull failed, will retry next cycle" >&2
            fi
            if ! ollama ps | awk '{print $$1}' | grep -qxF "$${model}"; then
              echo "ollama-keepalive: $${model} not loaded, warming up..."
              ollama run "$${model}" ok >/dev/null 2>&1 || echo "ollama-keepalive: warm-up failed, will retry next cycle" >&2
            fi
          else
            echo "ollama-keepalive: server not reachable yet, will retry" >&2
          fi
          sleep 180
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    environment: *backend-environment
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - ${BACKEND_WORKERS:-1}
    expose:
      - "5000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      # Root cause of a real production incident: redis had no dependents
      # anywhere in this file, and remote-deploy.sh's `up` only lists
      # backend/frontend/caddy/ollama explicitly (mirroring the "no
      # dependents, so it must be named explicitly" pattern ollama's own
      # comment below describes) -- redis was never in that list either, so
      # once its container was ever removed/not yet created on a given VM,
      # no subsequent deploy ever (re)created it. The app kept reporting
      # healthy throughout (backend's own healthcheck below only checks that
      # /db-health responds 200, not that its redis.reachable field is
      # true), so this degraded silently: real-time delivery (channel_hub.py
      # -- chat, notifications, live feed, media) is Redis-pub/sub-backed
      # even for this single-worker deployment and fails open (drops events,
      # never raises) rather than erroring, and upload_queue.py's job
      # durability silently fell back to in-memory-only. This dependency is
      # the actual fix: it makes redis a real dependent-having service, so
      # any `docker compose up backend ...` (this script's included) always
      # brings it up and waits for its own healthcheck first.
      redis:
        condition: service_healthy
      # Deliberately NOT gated on ollama's healthcheck: even though it's now
      # the default provider, the LLM step is still optional at every call
      # site (prompt_parser.parse_prompt fails open to the deterministic
      # parse). Requiring ollama to be healthy here would turn that optional
      # refinement into a hard dependency for booting at all.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/db-health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.0-alpine
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN is required}"
    # Explicit public resolvers: on this host, Docker's default DNS
    # forwarding to systemd-resolved's 127.0.0.53 stub is not reachable from
    # inside the container, which blocks the ACME/Let's Encrypt TLS lookups.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
  redis_data:
  caddy_data:
  caddy_config:
