[pytest]
testpaths = tests
# Put the backend/ directory itself on sys.path so `import app` works no
# matter how pytest is started. `python -m pytest` adds the CWD implicitly,
# but the bare `pytest` command (what CI runs) does not.
pythonpath = .
addopts = -ra --strict-markers
# A hung test/fixture-teardown should fail with a thread dump pointing at
# the exact stuck test, not silently burn the whole CI job's runtime (see
# channel_hub.py's stop_listener()/pubsub.close() fix -- an asyncio hang on
# Windows' ProactorEventLoop during shutdown is exactly the kind of thing
# this exists to catch next time, from wherever it happens). 120s is well
# above every legitimate single test's own worst case today (the slowest,
# _wait_for_analysis's librosa cold-JIT wait and the bulk-upload load
# tests, cap themselves at 60-90s), so this should only ever fire on an
# actual hang. "thread" rather than the default "signal" method: signal-
# based timeouts don't work on Windows, where this suite is also run.
timeout = 120
timeout_method = thread
